name: CI

on: [push, pull_request, workflow_dispatch]

env:
  MACOSX_DEPLOYMENT_TARGET: 13

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Install dependencies, then install HELICS from source
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libboost-dev ninja-build
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zeromq boost ninja
      # helics-ns3 needs the HELICS C++ shared library, which is not in the default HELICS build
      - name: Build and install HELICS
        run: |
          git clone --depth=1 -b v3.7.0 https://github.com/GMLC-TDC/HELICS.git helics-src
          cmake -S helics-src -B helics-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHELICS_BUILD_CXX_SHARED_LIB=ON -DHELICS_BUILD_EXAMPLES=OFF -DHELICS_BUILD_TESTS=OFF
          cmake --build helics-src/build
          sudo cmake --install helics-src/build
          rm -rf helics-src

      # Clone ns-3 and checkout this repository to the contrib subfolder
      - name: Clone ns-3
        run: |
          git clone --depth=1 -b ns-3.48 https://gitlab.com/nsnam/ns-3-dev.git .
      - uses: actions/checkout@v4
        with:
          path: contrib/helics

      - name: Configure ns-3
        run: |
          set -o pipefail
          ./ns3 configure --enable-examples --enable-tests --enable-modules="helics;point-to-point;csma;applications" -- -DNS3_WITH_HELICS=/usr/local | tee gha_ns3_configure.log
          ! grep -Fq "Skipping contrib/helics" gha_ns3_configure.log

      - name: Build ns-3
        run: ./ns3 build

      - name: Test
        run: ./test.py --no-build -s helics
